name: Validate ArgoCD Application

on:
  pull_request:
  merge_group:

jobs:
  validate-argocd-app:
    name: Validate Changed ArgoCD App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Identify changed Application manifest
        id: changed_file
        run: |
          FILE=$(git diff --name-only "origin/${{ github.base_ref }}" | \
                 grep -E '^(apps|setup)/argocd-apps/.*\.ya?ml$' | head -n 1 || true)
          echo "app_file=$FILE" >> "$GITHUB_OUTPUT"
          if [ -z "$FILE" ]; then
            echo "No ArgoCD application manifest changed by this PR. Nothing to validate."
          fi

      - name: Set up Helm
        if: steps.changed_file.outputs.app_file != ''
        uses: azure/setup-helm@v5

      - name: Install yq
        if: steps.changed_file.outputs.app_file != ''
        uses: mikefarah/yq@v4

      - name: Install chart-testing (ct)
        if: steps.changed_file.outputs.app_file != ''
        uses: helm/chart-testing-action@v2.8.0

      - name: Extract chart info
        if: steps.changed_file.outputs.app_file != ''
        id: chart
        run: |
          file="${{ steps.changed_file.outputs.app_file }}"
          echo "🔍 Parsing $file"

          # Applications declare either a single `spec.source` or a multi-source
          # `spec.sources` list (e.g. Longhorn). Try single-source first, fall
          # back to the first multi-source entry that references a Helm chart.
          extract() {
            local src_file="$1" path="$2" val
            val=$(yq e "select(di == 0) | .spec.source.$path" "$src_file" 2>/dev/null)
            if [[ -z "$val" || "$val" == "null" ]]; then
              val=$(yq e "select(di == 0) | ([.spec.sources[] | select(.chart != null)])[0].$path" "$src_file" 2>/dev/null)
            fi
            echo "$val"
          }

          chart=$(extract "$file" chart)
          repo=$(extract "$file" repoURL)
          version=$(extract "$file" targetRevision)
          values=$(extract "$file" helm.values)
          namespace=$(yq e 'select(di == 0) | .spec.destination.namespace' "$file")
          release=$(extract "$file" helm.releaseName)
          skip_schema=$(extract "$file" helm.skipSchemaValidation)

          if [[ -z "$chart" || "$chart" == "null" ]]; then
            echo "No Helm chart source in this Application (git-only source). Nothing to install-test."
            echo "chart=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$namespace" || "$namespace" == "null" ]]; then
            namespace="default"
          fi
          if [[ -z "$release" || "$release" == "null" ]]; then
            release="$chart"
          fi

          echo "chart=$chart" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "skip_schema=$([[ "$skip_schema" == "true" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          if [[ "$values" != "null" ]]; then
            echo "$values" > repo-values.yaml
          else
            : > repo-values.yaml
          fi
          echo "📋 Values that will actually be used for this Application:"
          cat repo-values.yaml

          # What's currently deployed on this branch, so we can test the real
          # upgrade path (old release -> new chart) rather than a fresh install.
          old_version=""
          if git show "origin/${{ github.base_ref }}:$file" > /tmp/base-file.yaml 2>/dev/null; then
            old_version=$(extract /tmp/base-file.yaml targetRevision)
            [[ "$old_version" == "null" ]] && old_version=""
          fi
          echo "old_version=$old_version" >> "$GITHUB_OUTPUT"
          echo "ℹ️ Currently deployed version on ${{ github.base_ref }}: ${old_version:-<new app, no prior version>}"

      - name: Pull chart(s)
        if: steps.chart.outputs.chart != ''
        run: |
          repo="${{ steps.chart.outputs.repo }}"
          chart="${{ steps.chart.outputs.chart }}"
          version="${{ steps.chart.outputs.version }}"

          # `helm repo add` only understands the classic HTTP index-based repo
          # format; OCI registries have no such index, so pull straight from
          # the oci:// reference instead of aliasing it as a repo.
          if [[ "$repo" == oci://* ]]; then
            pull() { helm pull "${repo}/${chart}" --version "$1" --untar --untardir "$2"; }
          else
            helm repo add testrepo "$repo"
            helm repo update
            pull() { helm pull "testrepo/${chart}" --version "$1" --untar --untardir "$2"; }
          fi

          mkdir -p charts
          pull "$version" charts

          # Only test our own real values, not whatever ci/ scenarios the
          # upstream chart happens to bundle (those test the upstream
          # maintainers' scenarios, not what we actually deploy).
          chart_dir="charts/${chart}"
          rm -rf "$chart_dir/ci"
          mkdir -p "$chart_dir/ci"
          cp repo-values.yaml "$chart_dir/ci/repo-values.yaml"

          old_version="${{ steps.chart.outputs.old_version }}"
          if [[ -n "$old_version" && "$old_version" != "$version" ]]; then
            mkdir -p charts-old
            if pull "$old_version" charts-old; then
              echo "have_old_chart=true" >> "$GITHUB_ENV"
            else
              echo "⚠️ Could not pull previous chart version $old_version; will fall back to a fresh install test."
              echo "have_old_chart=false" >> "$GITHUB_ENV"
            fi
          else
            echo "have_old_chart=false" >> "$GITHUB_ENV"
          fi

      - name: Prepare ct config dynamically
        if: steps.chart.outputs.chart != ''
        run: |
          # Base config for ct
          cat <<EOF > ct-config.yaml
          chart-dirs:
            - charts
          chart-repos: []
          check-version-increment: false
          debug: true
          EOF

          # `ct` shells out to `helm repo add` for every chart-repos entry,
          # which (like the manual pull above) can't handle OCI registries.
          # Vendored chart deps are already in the pulled archive, so it's
          # not needed for those; skip registering it for OCI sources.
          repo="${{ steps.chart.outputs.repo }}"
          if [[ "$repo" != oci://* ]]; then
            yq -i ".chart-repos += [\"testrepo=$repo\"]" ct-config.yaml
          fi

          chart_path="charts/${{ steps.chart.outputs.chart }}/Chart.yaml"

          if [ -f "$chart_path" ]; then
            echo "🔍 Checking dependencies in $chart_path..."
            deps=$(yq eval -o=json '[.dependencies[] | "\(.name)=\(.repository)"]' "$chart_path")
            echo "dependencies found: $deps"

            # Remove blank urls
            for repo in $(echo $deps | yq -e '.[]' -); do
              count=0
              url=$(echo $repo | yq -e 'split("=") | .[1]' -)
              if [ "$url" == "" ]; then
                echo "deleting $repo"
                deps=$(count=$count yq -e 'del(.[env(count)])' - <<< $deps)
              fi
              count=$((count + 1))
            done

            echo "final chart dependencies: $deps"
            yq -i ".chart-repos += $deps" ct-config.yaml

          else
            echo "⚠️ No Chart.yaml found at $chart_path"
          fi

          echo "✅ Final ct-config.yaml:"
          cat ct-config.yaml

      - name: Lint chart
        if: steps.chart.outputs.chart != ''
        run: |
          extra_args=()
          if [[ "${{ steps.chart.outputs.skip_schema }}" == "true" ]]; then
            echo "ℹ️ Application sets helm.skipSchemaValidation: true; matching that here."
            extra_args+=(--helm-lint-extra-args '--skip-schema-validation')
          fi

          ct lint \
            --config ct-config.yaml \
            --charts "charts/${{ steps.chart.outputs.chart }}" \
            --lint-conf .github/lintconf.yaml \
            --chart-yaml-schema .github/chart_schema.yaml \
            --validate-maintainers=false \
            "${extra_args[@]}"

      - name: Render chart (helm template)
        if: steps.chart.outputs.chart != ''
        run: |
          extra_args=()
          if [[ "${{ steps.chart.outputs.skip_schema }}" == "true" ]]; then
            extra_args+=(--skip-schema-validation)
          fi

          helm template "${{ steps.chart.outputs.release }}" "charts/${{ steps.chart.outputs.chart }}" \
            --namespace "${{ steps.chart.outputs.namespace }}" \
            -f repo-values.yaml "${extra_args[@]}" > /dev/null
          echo "✅ Chart renders cleanly with the values this repo actually uses."

      # Charts here need something the ephemeral kind cluster genuinely can't
      # provide (a real external credential, or host kernel support not
      # available on a GitHub-hosted runner) to ever reach Ready. `helm
      # template` above still catches schema/rendering breakage for them;
      # only the live install/upgrade check is skipped.
      #   - tailscale-operator: needs a real Tailscale OAuth secret.
      #   - longhorn: needs open-iscsi/iscsid on the host node, which kind
      #     runners don't provide; longhorn-manager crash-loops without it
      #     regardless of chart version or values.
      #   - immich: references an existingSecret (immich-db-secret) and an
      #     existingClaim PVC (immich-library-pvc) provisioned by other
      #     Applications in the real cluster, not by this chart. This
      #     isolated single-chart test has no way to see those.
      - name: Determine if live install is possible
        if: steps.chart.outputs.chart != ''
        id: installable
        run: |
          skip_list=("tailscale-operator" "longhorn" "immich")
          chart="${{ steps.chart.outputs.chart }}"
          installable=true
          for c in "${skip_list[@]}"; do
            if [[ "$chart" == "$c" ]]; then
              installable=false
              echo "⚠️ Skipping live install for '$chart': requires a real external credential not available in CI."
            fi
          done
          echo "installable=$installable" >> "$GITHUB_OUTPUT"

      - name: Create kind cluster
        if: steps.chart.outputs.chart != '' && steps.installable.outputs.installable == 'true'
        uses: helm/kind-action@v1.15.0

      # Real longhorn is excluded above (needs open-iscsi kind can't provide),
      # but most of our charts still request `storageClass: longhorn` for
      # their PVCs since that's our real cluster's provisioner. Stand in a
      # StorageClass of that name backed by kind's built-in local-path
      # provisioner so those PVCs bind and install/upgrade actually runs,
      # rather than every stateful chart's live-install timing out on an
      # unbound PVC.
      - name: Provide stand-in "longhorn" StorageClass
        if: steps.chart.outputs.chart != '' && steps.installable.outputs.installable == 'true'
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: longhorn
          provisioner: rancher.io/local-path
          volumeBindingMode: WaitForFirstConsumer
          reclaimPolicy: Delete
          EOF

      # Some charts (e.g. immich, with metrics.enabled: true) render a
      # ServiceMonitor, which only exists as a CRD once the Prometheus
      # Operator is installed. Our real cluster has it; the ephemeral kind
      # cluster doesn't, so `helm install` fails immediately with "no
      # matches for kind ServiceMonitor" before any pod even starts. Install
      # just the CRD (server-side: these CRDs exceed kubectl's client-side
      # apply annotation size limit) so charts that reference it still get a
      # real install/upgrade test.
      - name: Provide ServiceMonitor CRD
        if: steps.chart.outputs.chart != '' && steps.installable.outputs.installable == 'true'
        run: |
          kubectl apply --server-side -f \
            https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.77.1/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml

      - name: Install previous release (upgrade-path test)
        if: steps.chart.outputs.chart != '' && steps.installable.outputs.installable == 'true' && env.have_old_chart == 'true'
        run: |
          extra_args=()
          if [[ "${{ steps.chart.outputs.skip_schema }}" == "true" ]]; then
            extra_args+=(--skip-schema-validation)
          fi
          helm install "${{ steps.chart.outputs.release }}" "charts-old/${{ steps.chart.outputs.chart }}" \
            --namespace "${{ steps.chart.outputs.namespace }}" --create-namespace \
            -f repo-values.yaml --wait --timeout 5m "${extra_args[@]}"

      - name: Install or upgrade to new chart version
        if: steps.chart.outputs.chart != '' && steps.installable.outputs.installable == 'true'
        run: |
          extra_args=()
          if [[ "${{ steps.chart.outputs.skip_schema }}" == "true" ]]; then
            extra_args+=(--skip-schema-validation)
          fi
          if [[ "${{ env.have_old_chart }}" == "true" ]]; then
            echo "🔁 Simulating real upgrade: ${{ steps.chart.outputs.old_version }} -> ${{ steps.chart.outputs.version }}"
            helm upgrade "${{ steps.chart.outputs.release }}" "charts/${{ steps.chart.outputs.chart }}" \
              --namespace "${{ steps.chart.outputs.namespace }}" \
              -f repo-values.yaml --wait --timeout 10m "${extra_args[@]}"
          else
            echo "📦 No previous version to upgrade from; testing a fresh install."
            helm install "${{ steps.chart.outputs.release }}" "charts/${{ steps.chart.outputs.chart }}" \
              --namespace "${{ steps.chart.outputs.namespace }}" --create-namespace \
              -f repo-values.yaml --wait --timeout 10m "${extra_args[@]}"
          fi

      - name: Debug on failure
        if: failure() && steps.chart.outputs.chart != ''
        run: |
          ns="${{ steps.chart.outputs.namespace }}"
          echo "=== Pods ==="
          kubectl get pods -n "$ns" -o wide || true
          echo "=== Events ==="
          kubectl get events -n "$ns" --sort-by=.lastTimestamp || true
          echo "=== Describe pods ==="
          kubectl describe pods -n "$ns" || true
          echo "=== Container logs (current + previous, non-ready pods) ==="
          for pod in $(kubectl get pods -n "$ns" --no-headers 2>/dev/null | awk '$2 !~ /^([0-9]+)\/\1$/ {print $1}'); do
            for c in $(kubectl get pod "$pod" -n "$ns" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null); do
              echo "--- $pod / $c ---"
              kubectl logs "$pod" -n "$ns" -c "$c" --tail=100 || true
              echo "--- $pod / $c (previous) ---"
              kubectl logs "$pod" -n "$ns" -c "$c" --previous --tail=100 2>/dev/null || true
            done
          done

      - name: Upload ct logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ct-logs
          path: |
            .ct/lint.log
            .ct/install.log
          if-no-files-found: ignore

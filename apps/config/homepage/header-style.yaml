apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-header-style
  namespace: homepage
data:
  custom.css: |
    /* Metrics first; greeting, time and date below (Homepage v2.4.0). */
    #widgets-wrap {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 1rem;
      align-items: center;
    }

    #information-widgets-right {
      display: contents;
    }

    /* Homepage spells the Longhorn class "infomation" in this version. */
    #widgets-wrap > .infomation-widget-longhorn {
      grid-column: 1 / 7;
      grid-row: 1;
    }

    #widgets-wrap > .information-widget-kubernetes {
      grid-column: 7 / 13;
      grid-row: 1;
      justify-self: end;
    }

    #widgets-wrap > .information-widget-greeting {
      grid-column: 1 / 7;
      grid-row: 2;
    }

    #information-widgets-right > .information-widget-datetime:first-child {
      grid-column: 7 / 10;
      grid-row: 2;
      justify-self: end;
    }

    #information-widgets-right > .information-widget-datetime:last-child {
      grid-column: 10 / 13;
      grid-row: 2;
      justify-self: end;
    }

    /* Give metrics and long date text room on tablets and phones. */
    @media (max-width: 1023px) {
      #widgets-wrap {
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }

      #widgets-wrap > .infomation-widget-longhorn {
        order: 1;
      }

      #widgets-wrap > .information-widget-kubernetes {
        order: 2;
      }

      #widgets-wrap > .information-widget-greeting {
        order: 3;
      }

      #information-widgets-right > .information-widget-datetime {
        order: 4;
      }
    }

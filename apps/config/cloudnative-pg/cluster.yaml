apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: db-cluster
  namespace: cloudnative-pg
spec:
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16-0.3.0
  instances: 1

  postgresql:
    shared_preload_libraries:
      - 'vchord.so'

  superuserSecret:
    name: cluster-superuser-secret

  managed:
    roles:
      - name: immich
        ensure: present
        superuser: true
        login: true
        passwordSecret:
          name: immich-db-user-secret

  storage:
    size: 5Gi
    storageClass: longhorn

  monitoring:
    enablePodMonitor: true

  # Observed steady-state ~259Mi/9m - request set close to that, limit
  # gives headroom for query bursts. No CPU limit: throttling Postgres
  # under load causes worse problems (lock contention, latency spikes)
  # than letting it use spare node capacity when available.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: b2-backup

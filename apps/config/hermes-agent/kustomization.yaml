apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes-agent
resources:
  - namespace.yaml
  - storage.yaml
  - network-policy.yaml
  - deployment.yaml
configMapGenerator:
  - name: hermes-agent-config
    files:
      - config.yaml
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-1"

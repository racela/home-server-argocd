apiVersion: v1
kind: Namespace
metadata:
  name: hermes-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    # The upstream image's init starts as root, then runs Hermes as UID 10000.
    pod-security.kubernetes.io/enforce: baseline

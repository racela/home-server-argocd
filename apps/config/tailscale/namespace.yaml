# Talos enforces the "baseline" Pod Security Standard on every namespace
# by default (except kube-system, which gets "privileged") - see
# https://docs.siderolabs.com/kubernetes-guides/security/pod-security.
# The tailscale operator's proxy pods need NET_ADMIN + access to
# /dev/net/tun to create the tunnel interface, which "baseline" forbids.
# Previously applied by hand (`kubectl label ns ...`), never codified -
# this app's own Application syncs at an earlier wave than the main
# tailscale-operator chart so this exists before any pod is created.
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

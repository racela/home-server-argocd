apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-library-backup
  namespace: immich
spec:
  schedule: "0 19 * * *" # 19:00 UTC = 3am Philippine time (UTC+8)
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: restic-backup
              image: restic/restic:0.19.1
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  # Preserve the backup exit status even if notification delivery fails.
                  report_backup() {
                    result=$?
                    trap - EXIT HUP INT TERM
                    success=false
                    [ "$result" -eq 0 ] && success=true
                    attempt=1
                    while [ "$attempt" -le 3 ]; do
                      if wget -q -T 10 -O /dev/null --post-data='' \
                        --header="Authorization: Bearer ${GATUS_BACKUP_TOKEN}" \
                        "${GATUS_BACKUP_URL}?success=${success}&error=backup-or-retention-exit-${result}"; then
                        echo "Backup status reported to Gatus: success=${success}"
                        exit "$result"
                      fi
                      attempt=$((attempt + 1))
                      [ "$attempt" -gt 3 ] || sleep 2
                    done
                    echo "WARNING: Could not report backup status to Gatus" >&2
                    exit "$result"
                  }
                  trap report_backup EXIT
                  trap 'exit 129' HUP
                  trap 'exit 130' INT
                  trap 'exit 143' TERM
                  restic -o s3.connections=15 unlock --remove-all || true
                  restic -o s3.connections=15 init || true
                  # Pod names are random, and restic records the hostname
                  # per snapshot. Without a fixed --host, every snapshot
                  # is in its own forget group (retention never prunes)
                  # and has no parent (full re-scan every run).
                  restic -o s3.connections=15 backup /data --host immich --tag immich-library --json
                  restic -o s3.connections=15 forget --group-by paths --keep-daily 7 --prune
              # Higher than etcd-backup's equivalent job - scanning/
              # hashing a 150GB+ library needs more headroom than a
              # single small snapshot file.
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              env:
                - name: GATUS_BACKUP_URL
                  value: "http://gatus.gatus.svc.cluster.local/api/v1/endpoints/backups_immich-library/external"
                - name: GATUS_BACKUP_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gatus-backup-reporting
                      key: token
                - name: RESTIC_REPOSITORY
                  value: "s3:https://s3.us-west-004.backblazeb2.com/rafa-home-server-backups/immich/"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: immich-restic-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: immich-restic-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-restic-credentials
                      key: RESTIC_PASSWORD
              volumeMounts:
                - name: immich-library
                  mountPath: /data
                  readOnly: true
          volumes:
            - name: immich-library
              persistentVolumeClaim:
                claimName: immich-library-pvc
                readOnly: true

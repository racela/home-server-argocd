apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    chart: gatus
    repoURL: https://twin.github.io/helm-charts
    targetRevision: 1.5.0
    helm:
      releaseName: gatus
      values: |
        env:
          TELEGRAM_BOT_TOKEN:
            valueFrom:
              secretKeyRef:
                name: telegram-alerts
                key: TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID:
            valueFrom:
              secretKeyRef:
                name: telegram-alerts
                key: TELEGRAM_CHAT_ID
          GATUS_IMMICH_BACKUP_TOKEN:
            valueFrom:
              secretKeyRef:
                name: backup-reporting
                key: GATUS_IMMICH_BACKUP_TOKEN
          GATUS_ETCD_BACKUP_TOKEN:
            valueFrom:
              secretKeyRef:
                name: backup-reporting
                key: GATUS_ETCD_BACKUP_TOKEN
        ingress:
          enabled: true
          annotations:
            kubernetes.io/ingress.class: "nginx"
            nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
            cert-manager.io/cluster-issuer: "home-issuer"  
            nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
          tls:
            - hosts:
                - gatus.rafa.local
              secretName: gatus-tls   
          hosts:
            - gatus.rafa.local
          path: /
          pathType: Prefix
        config:
          metrics: true
          alerting:
            telegram:
              token: "${TELEGRAM_BOT_TOKEN}"
              id: "${TELEGRAM_CHAT_ID}"
          external-endpoints:
            - name: immich-library
              group: backups
              token: "${GATUS_IMMICH_BACKUP_TOKEN}"
              # Daily at 03:00 Asia/Manila, plus six hours of grace.
              heartbeat:
                interval: 30h
              alerts:
                - type: telegram
                  description: "Backup/upload/retention failed or no report received for 30 hours"
                  failure-threshold: 1
                  success-threshold: 1
                  send-on-resolved: true
            - name: etcd-snapshot
              group: backups
              token: "${GATUS_ETCD_BACKUP_TOKEN}"
              # Daily at 03:00 Asia/Manila, plus six hours of grace.
              heartbeat:
                interval: 30h
              alerts:
                - type: telegram
                  description: "Backup/upload/retention failed or no report received for 30 hours"
                  failure-threshold: 1
                  success-threshold: 1
                  send-on-resolved: true
          endpoints:
            - name: Plex
              group: media
              url: http://plex-plex-media-server.plex.svc.cluster.local:32400/identity
              interval: 1m
              conditions:
                - "[STATUS] == 200"
              alerts:
              - type: telegram
                description: "healthcheck failed"
                send-on-resolved: true

            - name: Home Assistant
              group: automation
              url: http://home-assistant.home-assistant.svc.cluster.local:8080/manifest.json
              interval: 1m
              conditions:
                - "[STATUS] == 200"
              alerts:
              - type: telegram
                description: "healthcheck failed"
                send-on-resolved: true

            - name: Longhorn UI
              group: storage
              url: http://longhorn-frontend.longhorn-system.svc.cluster.local
              interval: 1m
              conditions:
                - "[STATUS] == 200"
              alerts:
              - type: telegram
                description: "healthcheck failed"
                send-on-resolved: true

            - name: Deluge Web UI
              group: media
              url: http://deluge.plex.svc.cluster.local:8112
              interval: 1m
              conditions:
                - "[STATUS] == 200"
              alerts:
              - type: telegram
                description: "healthcheck failed"
                send-on-resolved: true

            - name: ArgoCD
              group: gitops
              url: http://argocd-server.argocd.svc.cluster.local/healthz
              interval: 1m
              client:
                insecure: true
              conditions:
                - "[STATUS] == 200"
              alerts:
              - type: telegram
                description: "healthcheck failed"
                send-on-resolved: true

            - name: Blocky
              group: dns
              url: blocky-udp-lb.blocky.svc.cluster.local
              interval: 1m
              dns:
                query-name: "healthcheck.blocky"
                query-type: "A"
              conditions:
                - "[DNS_RCODE] == NOERROR"
              alerts:
              - type: telegram
                description: "healthcheck failed"
                send-on-resolved: true

            - name: Otterwiki
              group: wiki
              url: http://otterwiki.otterwiki.svc.cluster.local/-/healthz
              interval: 1m
              conditions:
                - "[STATUS] == 200"
              alerts:
              - type: telegram
                description: "healthcheck failed"
                send-on-resolved: true

            - name: Immich
              group: media
              url: http://immich-server.immich.svc.cluster.local:2283/api/server/ping
              interval: 1m
              conditions:
                - "[STATUS] == 200"
              alerts:
              - type: telegram
                description: "healthcheck failed"
                send-on-resolved: true

        # Previously nested inside config: (gatus's own monitoring-config
        # YAML), which is a no-op for pod resources - this chart's actual
        # resources key is top-level. Values unchanged, just relocated.
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: gatus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatus-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: git@github.com:racela/home-server-argocd.git
    path: apps/config/gatus
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: gatus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

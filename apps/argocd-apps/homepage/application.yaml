apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    chart: homepage
    repoURL: https://jameswynn.github.io/helm-charts
    targetRevision: 2.1.0
    helm:
      releaseName: homepage
      values: |
        image:
          repository: ghcr.io/gethomepage/homepage
          # The chart defaults to v1.2.0; pin the current stable application.
          tag: v2.4.0
          pullPolicy: IfNotPresent

        enableRbac: true
        serviceAccount:
          create: true
          name: homepage

        # Common-library chart values; keep the pod compatible with Talos PSA.
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

        env:
          - name: TZ
            value: Asia/Manila
          - name: MY_POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: HOMEPAGE_ALLOWED_HOSTS
            value: "homepage.rafa.local,$(MY_POD_IP):3000"

        # Manually sealed following runbooks/homepage-widgets.md. Optional so missing
        # widget credentials never prevent the dashboard itself from starting.
        envFrom:
          - secretRef:
              name: homepage-widget-credentials
              optional: true

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi

        ingress:
          main:
            enabled: true
            ingressClassName: nginx
            annotations:
              nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
              cert-manager.io/cluster-issuer: home-issuer
              nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
              gethomepage.dev/enabled: "true"
              gethomepage.dev/name: Homepage
              gethomepage.dev/group: Operations
              gethomepage.dev/icon: homepage.png
              gethomepage.dev/description: Home cluster dashboard
              gethomepage.dev/pod-selector: app.kubernetes.io/name=homepage
            hosts:
              - host: homepage.rafa.local
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - hosts:
                  - homepage.rafa.local
                secretName: homepage-tls

        config:
          kubernetes:
            mode: cluster
            ingress: true
            gateway: false
            traefik: false
          bookmarks:
            - Bookmarks:
                - YouTube:
                    - icon: youtube.png
                      href: https://www.youtube.com/
                - Facebook:
                    - icon: facebook.png
                      href: https://www.facebook.com/
                - Reddit:
                    - icon: reddit.png
                      href: https://www.reddit.com/
                - Twitter:
                    - icon: twitter.png
                      href: https://twitter.com/
                - Gmail:
                    - icon: gmail.png
                      href: https://mail.google.com/
          settingsString: |
            title: Rafa's Home Server
            background:
              image: https://raw.githubusercontent.com/racela/home-server-argocd/master/assets/homepage/background.webp
              brightness: 75
            headerStyle: boxed
            statusStyle: dot
            theme: dark
            color: slate
            providers:
              longhorn:
                url: http://longhorn-frontend.longhorn-system.svc.cluster.local
            layout:
              Applications:
              Media:
              Operations:
              Infrastructure:
              Bookmarks:
                iconsOnly: true
          widgets:
            - datetime:
                text_size: 3xl
                locale: en-PH
                format:
                  timeZone: Asia/Manila
                  timeStyle: short
                  hour12: true
            - datetime:
                text_size: md
                locale: en-PH
                format:
                  timeZone: Asia/Manila
                  dateStyle: full
            - longhorn:
                expanded: true
                total: true
                labels: true
                nodes: true
            - kubernetes:
                cluster:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
                  label: home-server
                nodes:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
          # Web apps are discovered from their Ingress annotations. These
          # workloads have no ingress; use pod selectors for status/metrics.
          services:
            - Operations:
                - Tailscale:
                    icon: tailscale.png
                    href: https://login.tailscale.com/admin/machines
                    description: Home subnet router
                    namespace: tailscale
                    app: local-subnet-router
                    podSelector: tailscale.com/parent-resource=local-subnet-router
                    widget:
                      type: tailscale
                      deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}"
                      key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
                      fields: ["address", "last_seen", "expires", "update_available"]
            - Infrastructure:
                - Blocky:
                    icon: blocky.png
                    description: Local DNS and ad blocking
                    namespace: blocky
                    app: blocky
                    podSelector: app=blocky
                    widgets:
                      - type: customapi
                        url: http://homepage-metrics.homepage.svc.cluster.local:8080/blocky
                        refreshInterval: 30000
                        mappings:
                          - field: blocking
                            label: Blocking
                          - field: queries
                            label: Queries (≤24h)
                            format: number
                          - field: blocked
                            label: Blocked (≤24h)
                            format: number
                          - field: blockedPercent
                            label: Blocked
                            suffix: "%"
                      - type: customapi
                        url: http://homepage-metrics.homepage.svc.cluster.local:8080/blocky
                        refreshInterval: 30000
                        mappings:
                          - field: nodes
                            label: DNS nodes
                            format: number
                          - field: cached
                            label: Cached (≤24h)
                            format: number
                          - field: cacheHitPercent
                            label: Cache hits
                            suffix: "%"
                          - field: errors
                            label: Errors (≤24h)
                            format: number

  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: git@github.com:racela/home-server-argocd.git
    path: apps/config/homepage
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

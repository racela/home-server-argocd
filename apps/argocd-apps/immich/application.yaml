apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    chart: immich
    repoURL: oci://ghcr.io/immich-app/immich-charts/immich
    targetRevision: 0.13.2
    helm:
      releaseName: immich
      # Works around an upstream packaging bug in bjw-s-labs/helm-charts'
      # common library (>=5.1.0, pulled in by immich >=0.13.0): its own
      # .helmignore excludes schemas/, which its values.schema.json
      # self-references via a relative $ref, so the ref can't resolve once
      # vendored into immich's OCI package. Helm 3 tolerates this; Helm 4
      # (which this cluster's ArgoCD bundles) correctly treats it as a hard
      # failure, so the chart won't render at all without this.
      skipSchemaValidation: true
      values: |
        controllers:
          main:
            containers:
              main:
                env:
                  REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
                  DB_HOSTNAME: "db-cluster-rw.cloudnative-pg.svc.cluster.local"
                  DB_USERNAME: "immich"
                  DB_DATABASE_NAME: "immich"
                  DB_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: immich-db-secret
                        key: password
                  IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'

        immich:
          metrics:
            enabled: true
          persistence:
            library:
              existingClaim: immich-library-pvc
        valkey:
          enabled: true
          persistence:
            data:
              enabled: true
              size: 2Gi
              storageClass: longhorn
        server:
          enabled: true
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: ghcr.io/immich-app/immich-server
                    pullPolicy: IfNotPresent
          ingress:
            main:
              enabled: true
              annotations:
                # proxy-body-size is set to 0 to remove the body limit on file uploads
                nginx.ingress.kubernetes.io/proxy-body-size: "0"
                kubernetes.io/ingress.class: "nginx"
                nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
                cert-manager.io/cluster-issuer: "home-issuer"
                nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
              hosts:
                - host: immich.rafa.home
                  paths:
                    - path: "/"
                      service:
                        identifier: main
              tls:
                - hosts:
                    - immich.rafa.home
                  secretName: immich-tls
        machine-learning:
          enabled: true
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: ghcr.io/immich-app/immich-machine-learning
                    pullPolicy: IfNotPresent
                  env:
                    TRANSFORMERS_CACHE: /cache
                    HF_XET_CACHE: /cache/huggingface-xet
                    MPLCONFIGDIR: /cache/matplotlib-config
          persistence:
            cache:
              enabled: true
              size: 3Gi
              type: emptyDir
              accessMode: ReadWriteMany
              # storageClass: longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: git@github.com:racela/home-server-argocd.git
    path: apps/config/immich
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

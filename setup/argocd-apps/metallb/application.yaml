apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    chart: metallb
    repoURL: https://metallb.github.io/metallb
    targetRevision: 0.16.1
    helm:
      releaseName: metallb
      values: |
        # frrk8s defaults to enabled in this chart even though nothing
        # here uses BGP - confirmed no BGPPeer/BGPAdvertisement exist,
        # only L2Advertisement/IPAddressPool, so the speaker's L2/ARP
        # mode handles LB IP announcement entirely without it. Disabling
        # rather than resourcing 15 containers doing nothing.
        frrk8s:
          enabled: false
        controller:
          logLevel: info
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
        speaker:
          ignoreExcludeLB: true
          logLevel: info
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
  annotations:
    # One wave before the main app - the Namespace object here (with its
    # required Talos pod-security label) must exist before the chart
    # tries to create any pod, not CreateNamespace=true's unlabeled one.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: git@github.com:racela/home-server-argocd.git
    path: setup/config/metallb
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
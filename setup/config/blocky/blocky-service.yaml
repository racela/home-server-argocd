apiVersion: v1
kind: Service
metadata:
  name: blocky-udp-lb
  namespace: blocky
  annotations:
        metallb.universe.tf/allow-shared-ip: 'blocky'
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.242
  selector:
    app: blocky
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: 53
---
apiVersion: v1
kind: Service
metadata:
  name: blocky-tcp-lb
  namespace: blocky
  annotations:
        metallb.universe.tf/allow-shared-ip: 'blocky'
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.242
  selector:
    app: blocky
  ports:
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
---
apiVersion: v1
kind: Service
metadata:
  name: blocky-http
  namespace: blocky
spec:
  type: ClusterIP
  selector:
    app: blocky
  ports:
    - name: metrics
      port: 4000
      protocol: TCP
      targetPort: 4000
---
# Query every Blocky instance for aggregate statistics; the existing ClusterIP
# service balances requests and cannot provide a stable cluster-wide total.
apiVersion: v1
kind: Service
metadata:
  name: blocky-stats
  namespace: blocky
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: blocky
  ports:
    - name: http
      port: 4000
      targetPort: 4000

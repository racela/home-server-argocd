apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot-backup
  namespace: etcd-backup
spec:
  schedule: "0 19 * * *" # 19:00 UTC = 3am Philippine time (UTC+8)
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: etcd-snapshot
              image: ghcr.io/siderolabs/talosctl:v1.11.5
              args:
                - --talosconfig=/talosconfig/config
                - -n
                - "192.168.1.121" # any control-plane node has a full etcd replica
                - etcd
                - snapshot
                - /shared/etcd-snapshot.db
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: talosconfig
                  mountPath: /talosconfig
                  readOnly: true
                - name: shared
                  mountPath: /shared
          containers:
            - name: restic-backup
              image: restic/restic:0.19.1
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  started_at=$(date +%s)
                  # Notify after backup AND retention; never mask the backup exit status.
                  report_backup() {
                    result=$?
                    trap - EXIT HUP INT TERM
                    elapsed=$(( $(date +%s) - started_at ))
                    outcome="FAILED (exit ${result})"
                    [ "$result" -ne 0 ] || outcome="SUCCEEDED"
                    # Labels are static; the remaining message fields are numeric.
                    payload=$(printf '{"chat_id":"%s","text":"etcd upload backup %s. Duration: %ss. Backup and retention attempt completed."}' \
                      "$TELEGRAM_CHAT_ID" "$outcome" "$elapsed")
                    attempt=1
                    while [ "$attempt" -le 3 ]; do
                      if response=$(wget -q -T 10 -O - \
                        --header='Content-Type: application/json' --post-data="$payload" \
                        "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" 2>/dev/null) && \
                        printf '%s' "$response" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then
                        echo "Telegram backup notification delivered"
                        exit "$result"
                      fi
                      attempt=$((attempt + 1))
                      [ "$attempt" -gt 3 ] || sleep 2
                    done
                    echo "WARNING: Telegram notification delivery failed" >&2
                    exit "$result"
                  }
                  trap report_backup EXIT
                  trap 'exit 129' HUP
                  trap 'exit 130' INT
                  trap 'exit 143' TERM
                  restic -o s3.connections=15 unlock --remove-all || true
                  restic -o s3.connections=15 init || true
                  # Fixed --host: pod names are random, and without it
                  # every snapshot is in its own forget group so
                  # retention never prunes anything.
                  restic -o s3.connections=15 backup /shared --host etcd --tag etcd-snapshot --json
                  restic -o s3.connections=15 forget --group-by paths --keep-daily 7 --prune
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: backup-telegram
                      key: TELEGRAM_BOT_TOKEN
                - name: TELEGRAM_CHAT_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-telegram
                      key: TELEGRAM_CHAT_ID
                - name: RESTIC_CACHE_DIR
                  value: /tmp/restic-cache # UID 65534 (nobody) can't write restic's default $HOME/.cache
                - name: RESTIC_REPOSITORY
                  value: "s3:https://s3.us-west-004.backblazeb2.com/rafa-home-server-backups/etcd/"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-restic-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-restic-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-restic-credentials
                      key: RESTIC_PASSWORD
              volumeMounts:
                - name: shared
                  mountPath: /shared
          volumes:
            - name: talosconfig
              secret:
                secretName: etcd-backup-talosconfig
            - name: shared
              emptyDir: {}

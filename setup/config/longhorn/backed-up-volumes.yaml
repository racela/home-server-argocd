# Joins these 3 volumes to recurring-job groups (see
# recurring-job-daily-cnpg.yaml / recurring-job-weekly.yaml).
# Longhorn does not read labels from PVCs for pre-existing volumes, so
# these target the Longhorn Volume objects directly - which means the
# names below are the dynamically generated pvc-<uuid> names Longhorn
# assigned when these PVCs were first provisioned, not something
# declarative/human-chosen. If any of these 3 PVCs is ever deleted and
# recreated from scratch, the resulting volume gets a new name and
# this file needs updating to match (kubectl get pvc -A shows current
# volume names).
#
# home-assistant and plex-config only accumulate minor incremental
# state (device pairing, resume points) where losing a few days of it
# is a non-event -> weekly group with longer retention instead, so
# recovery points cover more time for the same cost.
#
# The CNPG postgres volume below is deliberately left with no group
# label - now that barman-cloud does continuous WAL archiving + daily
# base backups (see apps/config/cloudnative-pg/), a raw Longhorn
# snapshot of this volume is redundant and strictly worse (crash-
# consistent at best, no point-in-time recovery). The manifest itself
# is kept (not deleted) so ArgoCD continues to manage this resource
# instead of pruning the live Longhorn Volume object entirely.
apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: pvc-041d808f-906e-4e07-aa62-534ebe05fd06 # home-assistant
  namespace: longhorn-system
  labels:
    recurring-job-group.longhorn.io/weekly: enabled
---
apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: pvc-4dcb8a31-f46a-4172-b982-da94c518cdf7 # plex-config-pvc
  namespace: longhorn-system
  labels:
    recurring-job-group.longhorn.io/weekly: enabled
---
apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: pvc-1badab50-d940-49f9-a60d-222a9225bfc9 # cloudnative-pg db-cluster-1
  namespace: longhorn-system
  labels: {}

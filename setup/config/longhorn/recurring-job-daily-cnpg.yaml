apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "0 19 * * *" # 19:00 UTC = 3am Philippine time (UTC+8) daily - Longhorn manager runs in plain UTC
  task: backup
  groups:
    - critical
  retain: 7
  concurrency: 2
  labels: {}
